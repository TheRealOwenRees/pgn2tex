name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

jobs:
  thorough-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OCaml & Opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          opam-cache: true
          dune-cache: true

      - name: Install All Dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --with-doc

      - name: Metadata Audit
        run: opam lint

      - name: Full Quality Suite
        run: opam exec -- dune build @fmt @install @runtest @doc

      # OPTIONAL: Uncomment if you want to verify your Chess LaTeX output
